name: Publication privacy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-privacy:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Test publication identity guard
        run: node --test scripts/validate-git-identities.test.mjs scripts/check-publication-event.test.mjs
      - name: Check incoming commits and squash metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-publication-event.mjs
